[package]
name = "kairn-app"
version = "0.1.0"
edition = "2024"

[[bin]]
# `kairn` on PATH is the CLI (crates/kairn-cli); the app binary carries the
# -app suffix and is what bundles and launchers point at.
name = "kairn-app"
path = "src/main.rs"

[dependencies]
kairn-core = { path = "../kairn-core" }
gpui = "0.2.2"
# Pre-1.0 ecosystem: gpui-component pinned exactly (it must resolve to the same gpui
# as gpui-terminal). gpui-terminal is vendored in-tree (crates/gpui-terminal, forked
# from zortax/gpui-terminal @ 51f0292) so scrollback and mouse-wheel forwarding could
# be implemented; see its README for the local changes.
gpui-component = "=0.5.1"
gpui-component-assets = "=0.5.1"
gpui-terminal = { path = "../gpui-terminal" }
portable-pty = "0.9"
notify = "8"
futures = "0.3"
anyhow = "1"
parking_lot = "0.12"
chrono = "0.4"
