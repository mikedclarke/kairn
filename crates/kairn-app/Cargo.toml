[package]
name = "kairn-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
# `kairn` on PATH is the CLI (crates/kairn-cli); the app binary carries the
# -app suffix and is what bundles and launchers point at.
name = "kairn-app"
path = "src/main.rs"

[dependencies]
kairn-core = { path = "../kairn-core" }
gpui = "0.2.2"
# Pre-1.0 ecosystem: gpui-component pinned exactly (it must resolve to the same gpui
# as gpui-terminal). gpui-terminal is vendored in-tree (crates/gpui-terminal, forked
# from zortax/gpui-terminal @ 51f0292) for local changes: scrollback, mouse-wheel
# forwarding, SGR mouse reporting (click/drag/motion, all three buttons), bracketed
# paste, and focus in/out reporting; see its README.
gpui-component = "=0.5.1"
gpui-component-assets = "=0.5.1"
gpui-terminal = { path = "../gpui-terminal" }
portable-pty = "0.9"
notify = "8"
futures = "0.3"
anyhow = "1"
parking_lot = "0.12"
chrono = "0.4"
