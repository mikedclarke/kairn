[package]
name = "kairn-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The sync engine, deliberately UI-free and runtime-free: it compiles natively
# into the desktop app and, via UniFFI, into the iOS app, so the same cycle and
# conflict rules run on every platform with no protocol drift. Keeps gpui and
# any async runtime out of its dependency graph on purpose.
[dependencies]
kairn-core = { path = "../kairn-core" }
anyhow = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

# The concrete HTTP transport (spec §10), behind the `http` feature. `ureq` is a
# blocking, runtime-free client so the engine stays async-free and cross-compiles
# to iOS; TLS is off on purpose (v1 is plain HTTP over the tailnet, spec §3).
ureq = { version = "2", default-features = false, optional = true }

# The embedded filesystem watcher is a desktop-only immediacy optimisation;
# correctness comes from the periodic scan and explicit sync_now(), so iOS
# (which has no persistent watcher) simply builds without it.
[target.'cfg(not(target_os = "ios"))'.dependencies]
notify = "8"

[features]
# Exposes the in-memory fake server outside tests so the real server crate
# (GDL-672) can reuse it as a conformance oracle.
testkit = []
# The concrete HTTP transport (`HttpTransport`). Off by default so pure-logic
# users (and the engine's own tests) never pull an HTTP client; the iOS bridge
# and the desktop app enable it.
http = ["dep:ureq"]
