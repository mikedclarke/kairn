[package]
name = "kairn-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The notes/vault/settings core, deliberately UI-free: the app and the
# `kairn` CLI both build on it, and keeping gpui out of the dependency
# graph is a compile error here rather than a convention.
[dependencies]
anyhow = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
