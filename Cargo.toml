[workspace]
resolver = "3"
members = [
    "crates/kairn-core",
    "crates/kairn-sync",
    "crates/kairn-ffi",
    "crates/kairn-bridge",
    "crates/kairn-app",
    "crates/kairn-cli",
    "crates/gpui-terminal",
]
# Plain `cargo build`/`cargo run` at the root builds the app (binary
# `kairn-app`); the CLI is `cargo run -p kairn-cli` (binary `kairn`, which
# owns that name on PATH). Use `cargo test --workspace` to cover every member.
default-members = ["crates/kairn-app"]

# One version for the app, core, and CLI: bump it here when cutting a release
# (see docs/RELEASING.md). The vendored gpui-terminal fork keeps its own.
[workspace.package]
version = "0.3.6"
edition = "2024"
license = "MIT"
repository = "https://github.com/mikedclarke/kairn"

# Debug builds keep Kairn's own code unoptimised but compile every dependency
# (gpui, taffy, cosmic-text, alacritty) at opt-level 2: a full UI frame with
# deps at opt-level 0 costs hundreds of milliseconds on a power-limited machine.
[profile.dev.package."*"]
opt-level = 2

# The wildcard above excludes workspace members, and the vendored terminal
# renderer is per-frame hot-path code: keep it optimised in dev builds too.
[profile.dev.package.gpui-terminal]
opt-level = 2

# gpui-component vendored at 0.5.1 (crates.io has no newer release) to fix the
# text-input scroll bug that blanked overflowing dialog inputs; see
# vendor/gpui-component/KAIRN-CHANGES.md.
# gpui vendored at 0.2.2 to fix line wrapping breaking before closing
# punctuation (a trailing `)` wrapped alone onto the next line); see
# vendor/gpui/KAIRN-CHANGES.md.
[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }
gpui = { path = "vendor/gpui" }
